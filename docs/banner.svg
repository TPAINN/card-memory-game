<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Card Memory — A calm, premium memory game. Three levels, real 3D flips, a ticking ring.">
<title>Card Memory</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e0a18"/><stop offset="1" stop-color="#150f06"/></linearGradient>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5c563"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<linearGradient id="tt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f5c563"/></linearGradient>
<radialGradient id="orb"><stop offset="0" stop-color="#f5c563" stop-opacity=".55"/><stop offset="1" stop-color="#f5c563" stop-opacity="0"/></radialGradient>
<radialGradient id="orb2"><stop offset="0" stop-color="#a78bfa" stop-opacity=".45"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
<clipPath id="clip"><rect width="1280" height="360" rx="22"/></clipPath>
<style>
.bar{transform-box:fill-box;transform-origin:center bottom;animation:eq 1.4s ease-in-out infinite}
@keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pl 2.6s ease-in-out infinite}
@keyframes pl{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.3);opacity:1}}
.ring{transform-box:fill-box;transform-origin:center;animation:rg 4s ease-out infinite}
@keyframes rg{0%{transform:scale(.75);opacity:.6}100%{transform:scale(1.15);opacity:0}}
.float{animation:fl 6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.glow{filter:drop-shadow(0 0 8px #f5c563)}
.blink{animation:bk 1.1s steps(2,start) infinite}
@keyframes bk{to{opacity:0}}
.sweep{animation:sw 3.4s ease-in-out infinite}
@keyframes sw{0%,100%{transform:translateY(0)}50%{transform:translateY(272px)}}
.cell{animation:ce 3.2s ease-in-out infinite}
@keyframes ce{0%,100%{opacity:.25}50%{opacity:1}}
.scramble{animation:sc 3s ease-in-out infinite}
@keyframes sc{0%,100%{opacity:.15}30%,70%{opacity:1}}
.seg{transform-box:fill-box;transform-origin:left;animation:sg 3s ease-in-out infinite}
@keyframes sg{0%,100%{transform:scaleX(.2);opacity:.4}50%{transform:scaleX(1);opacity:1}}
.flip{transform-box:fill-box;transform-origin:center;animation:fp 5s ease-in-out infinite}
@keyframes fp{0%,40%,100%{transform:scaleX(1)}50%{transform:scaleX(.05)}60%,90%{transform:scaleX(1)}}
.ringbell{transform-box:fill-box;transform-origin:50% 8%;animation:rb 2.4s ease-in-out infinite}
@keyframes rb{0%,100%{transform:rotate(0)}15%{transform:rotate(9deg)}30%{transform:rotate(-9deg)}45%{transform:rotate(5deg)}60%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</defs>
<g clip-path="url(#clip)">
<rect width="1280" height="360" fill="url(#bg)"/>
<rect width="1280" height="360" fill="url(#grid)"/>
<circle cx="260" cy="40" r="260" fill="url(#orb)"><animate attributeName="cx" values="260;340;260" dur="14s" repeatCount="indefinite"/></circle>
<circle cx="1080" cy="340" r="300" fill="url(#orb2)"><animate attributeName="cy" values="340;290;340" dur="11s" repeatCount="indefinite"/></circle>
<g class="float"><g><rect x="800" y="40" width="100" height="136" rx="14" fill="url(#g1)" opacity=".9"/><rect x="810" y="50" width="80" height="116" rx="9" fill="none" stroke="#fff" stroke-opacity=".35"/><text x="850" y="120" text-anchor="middle" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="34" fill="#fff" opacity=".7">✦</text></g><g class="flip" style="animation-delay:-0s"><rect x="920" y="40" width="100" height="136" rx="14" fill="#15101f" stroke="#a78bfa" stroke-opacity=".9" stroke-width="2"/><text x="970" y="126" text-anchor="middle" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="54" fill="#a78bfa">◆</text></g><g><rect x="1040" y="40" width="100" height="136" rx="14" fill="url(#g1)" opacity=".9"/><rect x="1050" y="50" width="80" height="116" rx="9" fill="none" stroke="#fff" stroke-opacity=".35"/><text x="1090" y="120" text-anchor="middle" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="34" fill="#fff" opacity=".7">✦</text></g><g class="flip" style="animation-delay:-1.8s"><rect x="1160" y="40" width="100" height="136" rx="14" fill="#15101f" stroke="#f5c563" stroke-opacity=".9" stroke-width="2"/><text x="1210" y="126" text-anchor="middle" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="54" fill="#f5c563">●</text></g></g><g class="float" style="animation-delay:-1.1s"><g class="flip" style="animation-delay:-1.8s"><rect x="800" y="196" width="100" height="136" rx="14" fill="#15101f" stroke="#f5c563" stroke-opacity=".9" stroke-width="2"/><text x="850" y="282" text-anchor="middle" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="54" fill="#f5c563">●</text></g><g><rect x="920" y="196" width="100" height="136" rx="14" fill="url(#g1)" opacity=".9"/><rect x="930" y="206" width="80" height="116" rx="9" fill="none" stroke="#fff" stroke-opacity=".35"/><text x="970" y="276" text-anchor="middle" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="34" fill="#fff" opacity=".7">✦</text></g><g class="flip" style="animation-delay:-0s"><rect x="1040" y="196" width="100" height="136" rx="14" fill="#15101f" stroke="#a78bfa" stroke-opacity=".9" stroke-width="2"/><text x="1090" y="282" text-anchor="middle" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="54" fill="#a78bfa">◆</text></g><g><rect x="1160" y="196" width="100" height="136" rx="14" fill="url(#g1)" opacity=".9"/><rect x="1170" y="206" width="80" height="116" rx="9" fill="none" stroke="#fff" stroke-opacity=".35"/><text x="1210" y="276" text-anchor="middle" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="34" fill="#fff" opacity=".7">✦</text></g></g>
<text x="72" y="140" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="84" font-weight="800" letter-spacing="-2" fill="url(#tt)">Card Memory</text>
<text x="72" y="200" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="22" fill="#fff" fill-opacity=".72">A calm, premium memory game. Three levels, real 3D</text><text x="72" y="232" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="22" fill="#fff" fill-opacity=".72">flips, a ticking ring.</text>
<g transform="translate(72 292)"><rect width="104" height="34" rx="17" fill="#fff" fill-opacity=".06" stroke="#f5c563" stroke-opacity=".45"/><text x="52" y="22.5" text-anchor="middle" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#fff" fill-opacity=".85">React 19</text></g><g transform="translate(186 292)"><rect width="67" height="34" rx="17" fill="#fff" fill-opacity=".06" stroke="#f5c563" stroke-opacity=".45"/><text x="33" y="22.5" text-anchor="middle" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#fff" fill-opacity=".85">Vite</text></g><g transform="translate(262 292)"><rect width="58" height="34" rx="17" fill="#fff" fill-opacity=".06" stroke="#f5c563" stroke-opacity=".45"/><text x="29" y="22.5" text-anchor="middle" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="600" fill="#fff" fill-opacity=".85">PWA</text></g>
<rect x="1" y="1" width="1278" height="358" rx="21" fill="none" stroke="url(#g1)" stroke-opacity=".35" stroke-width="1.5"/>
</g>
</svg>
